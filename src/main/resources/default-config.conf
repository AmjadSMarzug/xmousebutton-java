# XMouseButton configuration
#
# Each [section] is a profile. Profiles are checked top to bottom and the first
# one whose match rules fit the active window is used. [default] is the fallback.
#
# Buttons: left, right, middle, x1, x2, wheel_up, wheel_down, wheel_left, wheel_right
# Actions:
#   passthrough            leave the input alone (default for anything unbound)
#   block                  swallow the input
#   key ctrl+shift+t       tap a shortcut (modifiers: ctrl, shift, alt, win)
#   click middle           click a physical button
#   wheel up 3             scroll (up, down, left, right; notches 1 to 20)
#   run notepad.exe        start a program ("quoted paths" are supported)
#   layer 2                while held, use the layer2.* bindings
#
# Match rules (both optional, glob patterns with * and ?):
#   match.process = chrome.exe, msedge.exe
#   match.title   = *YouTube*

[default]
x1 = key alt+left
x2 = key alt+right

[browser]
match.process = chrome.exe, msedge.exe, firefox.exe
x1 = key alt+left
x2 = key alt+right
wheel_left = key alt+left
wheel_right = key alt+right
middle = key ctrl+w

[code-editor]
match.process = Code.exe, idea64.exe, devenv.exe
middle = layer 2
layer2.left = key f12
layer2.wheel_up = key ctrl+plus
layer2.wheel_down = key ctrl+minus
